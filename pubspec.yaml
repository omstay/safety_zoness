name: safetyzoness
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # --- Firebase ---
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.2.9

  # --- Notifications & Utilities ---
  flutter_local_notifications: ^17.2.3
  shared_preferences: ^2.3.4
  connectivity_plus: ^6.1.4
  permission_handler: ^12.0.0+1
  provider: ^6.1.2

  # --- Files & Data ---
  path_provider: ^2.1.4
  pdf: ^3.11.1
  printing: ^5.14.2
  share_plus: ^11.0.0
  open_filex: ^4.3.2
  excel: ^4.0.3

  # --- Networking ---
  http: ^1.2.2
  dio: ^5.7.0

  # --- UI / Utility ---
  intl: ^0.20.2
  image_picker: ^1.1.2
  signature: ^5.3.0
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

  # --- Localization ---
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: false
  image_path: "lib/assets/images/logo.jpeg"

flutter:
  uses-material-design: true

  assets:
    - lib/assets/images/logo.jpeg
    - lib/assets/images/bill.jpeg

    - lib/assets/images/paymentqr.jpeg

  fonts:
    - family: Roboto
      fonts:
        - asset: lib/assets/fonts/Roboto-Regular.ttf
